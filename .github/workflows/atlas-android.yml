name: ATLAS Python Android acceptance
on:
  push:
    branches: [main]
    paths: ['android-app/atlas_go/**', 'android-app/main.py', 'android-app/buildozer.spec', 'android-app/requirements*.txt', 'android-app/tests/**', '.github/workflows/atlas-android.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python packaging prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git zip unzip autoconf libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext ccache xvfb libgl1-mesa-dri libmtdev1
          python -m pip install -r requirements-dev.txt 'git+https://github.com/kivy/buildozer@76bac28545c66bbcc671d49aca553a747d69608e' 'Cython==0.29.34' setuptools legacy-cgi
      - name: Python domain and desktop UI tests
        run: |
          python -m pytest tests --junitxml=test-output/unit-tests.xml
          ATLAS_UI_TEST=1 ATLAS_DATA_DIR="$PWD/local-data" KIVY_NO_ARGS=1 xvfb-run -a -s '-screen 0 440x940x24' python main.py
          python scripts/verify-acceptance.py local-data/test-output
          ATLAS_UI_TEST=1 ATLAS_PREVIEW_SIZE=360x780 ATLAS_DATA_DIR="$PWD/local-data-narrow" KIVY_METRICS_FONTSCALE=1.2 KIVY_NO_ARGS=1 xvfb-run -a -s '-screen 0 360x780x24' python main.py
          python scripts/verify-acceptance.py local-data-narrow/test-output
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.buildozer
            android-app/.buildozer
            ~/.gradle
          key: atlas-p4a-36-28c-v1-${{ hashFiles('android-app/buildozer.spec') }}
      - name: Build Python Android APK and release AAB
        run: |
          buildozer -v android debug > build-android.log 2>&1
          buildozer -v android release >> build-android.log 2>&1
          python scripts/check-native-alignment.py bin/*release.aab | tee test-output/native-alignment.txt
          mkdir -p release
          cp bin/*debug.apk release/atlas-go-demo.apk
          cp bin/*release.aab release/atlas-go-unsigned.aab
          find .buildozer -name gradlew -print > release/gradle-projects.txt
          cp "$(find ~/.buildozer -name apksigner.jar | head -1)" release/apksigner.jar
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.buildozer
            android-app/.buildozer
            ~/.gradle
          key: atlas-p4a-36-28c-v1-${{ hashFiles('android-app/buildozer.spec') }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 Python UI acceptance and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          disable-animations: true
          working-directory: android-app
          script: bash scripts/emulator-acceptance.sh
      - name: Package evidence
        run: |
          cp -r test-output release/
          sha256sum release/*.apk release/*.aab > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-go-python-android
          path: |
            android-app/release/
            android-app/test-output/
            android-app/build-android.log
            android-app/local-data/test-output/
            android-app/local-data-narrow/test-output/
          if-no-files-found: warn
          retention-days: 30

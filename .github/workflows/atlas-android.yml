name: ATLAS Python Android acceptance
on:
  push:
    branches: [main]
    paths: ['android-app/atlas_go/**', 'android-app/main.py', 'android-app/buildozer.spec', 'android-app/requirements*.txt', 'android-app/tests/**', 'android-app/assets/**', 'android-app/scripts/**', '.github/workflows/atlas-android.yml']
  workflow_dispatch:
concurrency:
  group: atlas-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python packaging prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git zip unzip autoconf libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext ccache xvfb libgl1-mesa-dri libmtdev1
          python -m pip install -r requirements-dev.txt 'git+https://github.com/kivy/buildozer@76bac28545c66bbcc671d49aca553a747d69608e' 'Cython==0.29.34' setuptools legacy-cgi
      - name: Python domain and desktop UI tests
        run: |
          python -m compileall -q main.py atlas_go scripts tests
          python -m pytest tests --junitxml=test-output/unit-tests.xml
          ATLAS_UI_TEST=1 ATLAS_DATA_DIR="$PWD/local-data" KIVY_NO_ARGS=1 xvfb-run -a -s '-screen 0 440x940x24' python main.py
          python scripts/verify-acceptance.py local-data/test-output
          ATLAS_UI_TEST=1 ATLAS_PREVIEW_SIZE=360x780 ATLAS_DATA_DIR="$PWD/local-data-narrow" KIVY_METRICS_FONTSCALE=1.2 KIVY_NO_ARGS=1 xvfb-run -a -s '-screen 0 360x780x24' python main.py
          python scripts/verify-acceptance.py local-data-narrow/test-output
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ~/.buildozer
            android-app/.buildozer
            ~/.gradle
          key: atlas-p4a-36-28c-v1-${{ hashFiles('android-app/buildozer.spec') }}
          restore-keys: atlas-p4a-36-28c-v1-
      - name: Build Python Android APK and release AAB
        run: |
          set -euo pipefail
          buildozer -v android debug > build-android.log 2>&1
          buildozer -v android release >> build-android.log 2>&1
          python scripts/check-native-alignment.py bin/*release.aab | tee test-output/native-alignment.txt
          mkdir -p release
          cp bin/*debug.apk release/atlas-go-demo.apk
          cp bin/*release.aab release/atlas-go-unsigned.aab
          find .buildozer -name gradlew -print > release/gradle-projects.txt
          cp "$(find ~/.buildozer -name apksigner.jar | head -1)" release/apksigner.jar
      - name: Validate release bundle and produce release smoke APK
        run: |
          curl -fL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o /tmp/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  /tmp/bundletool.jar' | sha256sum -c -
          java -jar /tmp/bundletool.jar validate --bundle release/atlas-go-unsigned.aab
          java -jar /tmp/bundletool.jar dump manifest --bundle release/atlas-go-unsigned.aab --module base > test-output/release-manifest.xml
          python scripts/check-manifest.py test-output/release-manifest.xml
          keytool -genkeypair -keystore /tmp/atlas-smoke.p12 -storetype PKCS12 -alias smoke -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=ATLAS CI Smoke'
          java -jar /tmp/bundletool.jar build-apks --bundle release/atlas-go-unsigned.aab --output /tmp/release-smoke.apks --mode universal --ks /tmp/atlas-smoke.p12 --ks-key-alias smoke --ks-pass pass:android --key-pass pass:android
          unzip -p /tmp/release-smoke.apks universal.apk > release/atlas-go-release-smoke.apk
      - uses: actions/cache/save@v6
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.buildozer
            android-app/.buildozer
            ~/.gradle
          key: atlas-p4a-36-28c-v1-${{ hashFiles('android-app/buildozer.spec') }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 Python UI acceptance and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          working-directory: android-app
          script: python scripts/emulator-acceptance.py
      - name: Package evidence
        run: |
          cp -r test-output release/
          sha256sum release/*.apk release/*.aab > release/SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: atlas-go-python-android
          path: |
            android-app/release/
            android-app/test-output/
            android-app/build-android.log
            android-app/local-data/test-output/
            android-app/local-data-narrow/test-output/
          if-no-files-found: warn
          # Contains the APK/AABs; keep briefly because app files are shared only on request.
          retention-days: 2

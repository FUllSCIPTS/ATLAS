# Temporary (branch only, removed before merging): publish the 1.4.0 source archive as a release asset.
name: ATLAS Go 1.4.0 source release
on:
  push:
    branches: [atlas-go-1.4.0]
    paths: ['.github/workflows/atlas-go-draft-assets.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build atlas-go-1.4.0-source.zip and create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=atlas-go-1.4.0-source
          mkdir -p "/tmp/$root"
          git archive --format=tar HEAD android-app LICENSE | tar -x -C "/tmp/$root"
          rm -rf "/tmp/$root/android-app/docs/video"
          find "/tmp/$root" -name '*.md' -exec sed -i 's/`@@SRC14_SHA@@`/listed in SOURCE-SHA256.txt on the release page/' {} +
          find "/tmp/$root" -exec touch -d '2026-11-14 15:00:00Z' {} +
          (cd /tmp && find "$root" | sort | zip -q -X -@ "$GITHUB_WORKSPACE/atlas-go-1.4.0-source.zip")
          sha256sum atlas-go-1.4.0-source.zip | tee SOURCE-SHA256.txt
          unzip -l atlas-go-1.4.0-source.zip | tail -1
          if ! gh release view atlas-go-v1.4.0 >/dev/null 2>&1; then
            gh release create atlas-go-v1.4.0 --target "$GITHUB_SHA" --prerelease --title 'ATLAS Go 1.4.0 — Python Android demo' \
              --notes 'ATLAS Go 1.4.0: the Layer 1 live loop on the phone (LSTM forecasts, RL supply agent acts, outcomes recorded, both models retrained and validated), plus the 1.3.0 digital twin with three agents and shared rides that drop the rider already on board first. Source: atlas-go-1.4.0-source.zip (MIT). The APK is shared on request from the ATLAS Go downloads folder on Google Drive. Release notes and validation: android-app/releases/1.4.0/.'
          fi
          gh release upload atlas-go-v1.4.0 atlas-go-1.4.0-source.zip SOURCE-SHA256.txt --clobber

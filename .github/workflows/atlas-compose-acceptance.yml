name: ATLAS Compose acceptance

on:
  push:
    branches: [architecture-explorer]
    paths:
      - '.github/workflows/atlas-compose-acceptance.yml'
      - 'architecture-explorer/starter/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: architecture-explorer/starter
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate the Compose configuration
        run: docker compose config --quiet
      - name: Start PostgreSQL, Apache Kafka and the ride services
        run: docker compose up -d --build
      - name: Verify the ride lifecycle and trained model outputs
        run: docker compose exec -T gateway python -m tests.smoke
      - name: Verify policy approval and rollback
        run: docker compose exec -T gateway python -m tests.policy
      - name: Verify duplicate replay and committed Kafka offsets
        run: docker compose exec -T -e KAFKA_BOOTSTRAP=kafka:9092 gateway python -m tests.replay
      - name: Print container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
      - name: Stop the disposable runner stack
        if: always()
        run: docker compose down --volumes

name: Publish existing signed ATLAS Android bundle

on:
  push:
    branches: [main]
    paths:
      - android-app/releases/SIGNED_ZIP_RECIPE.json
      - android-app/releases/SIGNED_VALIDATION.json
      - android-app/releases/upload-certificate.pem
      - android-app/releases/restore-signed-bundle.py
      - .github/workflows/publish-signed-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-go-signed-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: FUllSCIPTS/ATLAS
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the previously tested binaries
        run: |
          mkdir downloads
          gh release download atlas-go-v1.0.0 --pattern atlas-go-unsigned.aab --pattern atlas-go-demo.apk --dir downloads
          (cd downloads && sha256sum --ignore-missing -c "$GITHUB_WORKSPACE/android-app/releases/SHA256SUMS")
      - name: Restore the exact signed bundle without a private key
        run: |
          python android-app/releases/restore-signed-bundle.py --unsigned downloads/atlas-go-unsigned.aab --output downloads/atlas-go-play.aab
          jarsigner -verify downloads/atlas-go-play.aab
          keytool -printcert -rfc -jarfile downloads/atlas-go-play.aab > signed-certificate.pem
          python - <<'PY'
          import hashlib, json, ssl
          from pathlib import Path
          record = json.loads(Path('android-app/releases/SIGNED_VALIDATION.json').read_text())
          actual = hashlib.sha256(Path('downloads/atlas-go-play.aab').read_bytes()).hexdigest()
          assert actual == record['sha256'], 'Signed bundle does not match signing record'
          cert = Path('signed-certificate.pem').read_text()
          start = cert.index('-----BEGIN CERTIFICATE-----')
          end = cert.index('-----END CERTIFICATE-----', start) + len('-----END CERTIFICATE-----')
          fingerprint = hashlib.sha256(ssl.PEM_cert_to_DER_cert(cert[start:end])).hexdigest()
          assert fingerprint == record['upload_certificate_sha256'], 'Upload certificate does not match'
          print('Signed bundle and upload certificate match the existing verified handover')
          PY
      - name: Publish signed download and evidence
        run: |
          cp android-app/releases/SIGNED_VALIDATION.json downloads/
          cp android-app/releases/upload-certificate.pem downloads/
          (cd downloads && sha256sum atlas-go-demo.apk atlas-go-unsigned.aab atlas-go-play.aab > SHA256SUMS)
          gh release upload atlas-go-v1.0.0 downloads/atlas-go-play.aab downloads/SIGNED_VALIDATION.json downloads/upload-certificate.pem downloads/SHA256SUMS --clobber
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('android-app/releases/SIGNED_VALIDATION.json').read_text())
          notes = f'''Python/Kivy offline model: solo rides, shared-seat reservations and food ordering. All bookings, deliveries and charges are simulated.

          Downloads:
          - atlas-go-demo.apk: directly installable Android demonstration.
          - atlas-go-play.aab: existing owner-signed bundle for Play Console internal testing. Signature, exact SHA-256 and upload certificate verified during publication.
          - atlas-go-unsigned.aab: reproducible unsigned build.
          - atlas-go-screenshots.zip: twelve actual Android app screenshots.
          - SHA256SUMS, SIGNED_VALIDATION.json, upload-certificate.pem, android-ui-results.json and native-alignment.txt: verification evidence. The certificate is public; no private key is included.

          Validation: 40 Python regression cases, 88 desktop assertions in each of two configurations, 112 Android 16 assertions, release launch and 16 KB native alignment checks.
          Tested source: {record['source_commit']}
          Build evidence: {record['test_run']}

          Source and user guide: https://github.com/FUllSCIPTS/ATLAS/tree/main/android-app
          Play submission guide: https://github.com/FUllSCIPTS/ATLAS/blob/main/android-app/docs/GOOGLE_PLAY.md

          The AAB is prepared for an internal-test upload; this is not a Google Play publication or approval. Account declarations and any Console testing/review requirements remain with the owner.
          '''
          Path('release-notes.md').write_text('\n'.join(line.removeprefix('          ') for line in notes.splitlines()) + '\n')
          PY
          gh release edit atlas-go-v1.0.0 --notes-file release-notes.md
